# Nexus — local dev stack.
# Only Neo4j is wired here. The api / ingest / web services are stubbed out and get
services:
  neo4j:
    image: neo4j:5.26.28-community@sha256:20779498e70e05772836fb980449bf691f519b42d87372e3f499312cb32c5430
    container_name: nexus-neo4j
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # $$ escapes so Compose passes the literal value from .env into the container.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      # Use a project-specific name so Neo4j does not interpret this as a
      # database setting. The healthcheck reads it inside the container.
      NEXUS_NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEXUS_NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nexus-neo4j-data:
  nexus-neo4j-logs:

