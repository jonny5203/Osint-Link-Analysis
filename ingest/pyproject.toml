[project]
name = "nexus-ingest"
version = "0.1.0"
description = "Nexus — OSINT sanctions ingestion + entity resolution"
requires-python = "==3.13.*"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "neo4j>=5.23",
    "lxml>=5.2",
    "python-dotenv>=1.0",
]

[project.scripts]
nexus-ingest = "nexus_ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ingest"]

[project.optional-dependencies]
enrichment = [
    "pandas>=2.2",
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
required-version = "==0.10.4"
